name: build
on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

jobs:
    build:
        name: build-windows
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: lukka/get-cmake@latest
            - uses: ilammy/msvc-dev-cmd@v1
            - name: configure
              shell: pwsh
              run: cmake --preset actions-release
            - name: build
              shell: pwsh
              run: cmake --build --preset actions --target install
            - uses: actions/upload-artifact@v4
              with:
                  name: revisited-custom
                  path: out/build/actions-release/revisited-custom.zip
